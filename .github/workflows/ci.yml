name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-glx libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
