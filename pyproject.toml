[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcriber"
version = "0.1.0"
description = "An accessible desktop player for reviewing audio recordings, and the foundation for multi-service transcription."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "mutagen>=1.47",
    "av>=12.0",
    "openai>=2.50.0",
    "elevenlabs>=2.0",
    "assemblyai>=1.0",
    "deepgram-sdk>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.gui-scripts]
audio-transcriber = "audio_transcriber.app:main"

[tool.setuptools.packages.find]
include = ["audio_transcriber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
